name: Queue contract integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sqs-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Verify SQS delivery and DLQ redrive
        run: bash scripts/verify-queue-integration.sh
