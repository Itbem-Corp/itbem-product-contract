name: Queue contract integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sqs-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Verify SQS delivery and DLQ redrive
        run: bash scripts/verify-queue-integration.sh
