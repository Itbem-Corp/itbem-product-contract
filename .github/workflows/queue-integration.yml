name: Queue contract integration

on:
  pull_request:
    paths: [contract/runtime-messages.v1.json, scripts/verify-queue-integration.sh, .github/workflows/queue-integration.yml]
  push:
    branches: [main]
    paths: [contract/runtime-messages.v1.json, scripts/verify-queue-integration.sh, .github/workflows/queue-integration.yml]

permissions:
  contents: read

jobs:
  sqs-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.1
      - name: Verify SQS delivery and DLQ redrive
        run: bash scripts/verify-queue-integration.sh
